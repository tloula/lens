[project]
name = "lens"
version = "0.1.0"
description = "Stock photo search and download for agents, plus a shared stock audio library over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "keyring>=25",
    "Pillow>=10",
]

[project.optional-dependencies]
server = ["fastapi>=0.115"]
mcp = [
    "boto3>=1.35",
    "fastmcp>=4.1",
    "mutagen>=1.47",
    "uvicorn>=0.30",
]

[project.scripts]
lens = "lens.cli:main"
lens-mcp = "lens.mcp_server:main"

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "boto3>=1.35",
    "fastapi>=0.115",
    "fastmcp>=4.1",
    "moto[s3]>=5",
    "mutagen>=1.47",
    "pyright>=1.1.390",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "PIE", "PGH", "RUF"]
ignore = ["E501", "B008"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
